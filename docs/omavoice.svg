  <text x="248" y="108" fill="#F4F7F5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.2">Omavoice</text>
  <text x="250" y="148" fill="#8B9A92" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Your voice, better heard.</text>
